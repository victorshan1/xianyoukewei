name: CI

# 触发：push 到任意分支、PR 创建/更新
on:
  push:
  pull_request:

jobs:
  test:
    name: 单元 + 集成测试
    runs-on: ubuntu-latest
    # node:sqlite 需要 Node 22.5+，用 LTS 最新
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: npm ci

      - name: 运行全部测试（单元 + 集成）
        working-directory: backend
        run: npm test

      - name: 覆盖率报告（单元）
        working-directory: backend
        run: npm run test:coverage
