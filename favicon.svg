        stroke="#4A90D9" 
        stroke-width="2"/>
  
  <!-- 装饰线条（代表知识） -->
  <line x1="32" y1="42" x2="45" y2="40" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="45" y2="48" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="45" y2="56" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
  
  <line x1="55" y1="40" x2="68" y2="42" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="68" y2="50" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="56" x2="68" y2="58" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
</svg>
