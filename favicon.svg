<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="#4A90D9"/>
  
  <!-- 书本图标 -->
  <path d="M 25 35 L 25 70 L 50 65 L 75 70 L 75 35 L 50 30 Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="2" 
